apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubernetes-manifest-updater
  namespace: gitlab
  labels:
    app: kubernetes-manifest-updater
spec:
  selector:
    matchLabels:
      name: kubernetes-manifest-updater
  template:
    metadata:
      labels:
        name: kubernetes-manifest-updater
    spec:
      tolerations:
      - operator: Exists
        effect: NoSchedule
      containers:
      - name: git-puller
        image: alpine/git:latest
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command: ["/bin/sh", "-c"]
        args:
        - |
          cd /manifest
          git config --global --add safe.directory /manifest

          if [ ! -d ".git" ]; then
            echo "cloning now..."
            git clone $KUBERNETES_REPO_URL .
          else
            echo "pulling now..."
            git fetch origin

            if [ -n "$(git status --porcelain)" ]; then
              echo "working tree has local changes. skip update."
              exec sleep infinity
            else
              git reset --hard origin/main
            fi
          fi

          echo "completed"
          exec sleep infinity
        volumeMounts:
        - name: host-dir
          mountPath: /manifest
          mountPropagation: None
        env:
        - name: KUBERNETES_REPO_URL
          valueFrom:
             secretKeyRef:
              name: gitlab-runner-token
              key: k8s-repo-url
      volumes:
      - name: host-dir
        hostPath:
          path: /home/bababa/kubernetes_manifest
          type: Directory