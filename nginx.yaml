# nginx:stable-alpine3.23-perl
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rp-nginx
  labels:
    app: rp-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rp-nginx
  template:
    metadata:
      labels:
        app: rp-nginx
    spec:
      containers:
      - name: app
        image: nginx:stable-alpine3.23-perl
        volumeMounts:
        - name: config
          mountPath: "/etc/nginx/conf.d"
          readOnly: true
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: http-2
          containerPort: 8080
          protocol: TCP
      volumes:
      - name: config
        configMap:
          name: nginx-config
          items: 
          - key: "default.conf"
            path: "default.conf"

---
apiVersion: v1
kind: Service
metadata:
  name: rp-nginx
spec: 
  selector:
    app: rp-nginx
  ports:
  - protocol: TCP
    port: 80
    name: http
  - protocol: TCP
    port: 8080
    name: http-2

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { 
      default upgrade;
      ''      close;
    }

    # Proxmox Console
    server{
      listen 80;
      server_name proxmox-console.newvia.net;

      proxy_http_version 1.1;
      proxy_set_header  Host $host;
      proxy_set_header Upgrade $http_upgrade; 
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Host  $host;
      proxy_set_header  X-Forwarded-Server  $host;
      proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    
      location / {
        proxy_pass  https://172.32.0.101:8006/;
      }
    }

      # Git-Lab
    server{
      listen 8080;
      server_name gitlab.newvia.net;

      proxy_http_version 1.1;
      proxy_set_header  Host $host;
      proxy_set_header Upgrade $http_upgrade; 
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Host  $host;
      proxy_set_header  X-Forwarded-Server  $host;
      proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    
      location / {
        proxy_pass  http://172.32.0.70;
      }
    }
