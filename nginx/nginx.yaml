# nginx:stable-alpine3.23-perl
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rp-nginx
  labels:
    app: rp-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rp-nginx
  template:
    metadata:
      labels:
        app: rp-nginx
    spec:
      initContainers:
      - name: cert-downloader
        image: alpine/curl:8.20.0
        command: ["sh", "-c"]
        args:
        - "curl -sk https://vault-0.vault-internal.vault.svc.cluster.local:8200/v1/pki/cert/ca/raw/pem -o /etc/nginx/ssl/backend_ca.pem && echo >> /etc/nginx/ssl/backend_ca.pem"
        volumeMounts:
        - name: cert-volume
          mountPath: /etc/nginx/ssl
      containers:
      - name: app
        image: nginx:stable-alpine3.23-perl
        volumeMounts:
        - name: config
          mountPath: "/etc/nginx/conf.d"
          readOnly: true
        - name: cert-volume
          mountPath: /etc/nginx/ssl
          readOnly: true
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
      volumes:
      - name: config
        configMap:
          name: nginx-config
          items: 
          - key: "default.conf"
            path: "default.conf"
      - name: cert-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: rp-nginx
spec: 
  selector:
    app: rp-nginx
  ports:
  - protocol: TCP
    port: 80
    name: http

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { 
      default upgrade;
      ''      close;
    }

    # Proxmox Console
    server{
      listen 80;
      server_name proxmox-console.newvia.net;
      
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/ssl/backend_ca.pem;
      proxy_ssl_server_name on;

      proxy_http_version 1.1;
      proxy_set_header  Host $host;
      proxy_set_header Upgrade $http_upgrade; 
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Host  $host;
      proxy_set_header  X-Forwarded-Server  $host;
      proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    
      location / {
        proxy_pass  https://172.31.100.101:8006/;
      }
    }

      # Git-Lab
    server{
      listen 80;
      server_name gitlab.newvia.net;

      proxy_http_version 1.1;
      proxy_set_header  Host $host;
      proxy_set_header Upgrade $http_upgrade; 
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Host  $host;
      proxy_set_header  X-Forwarded-Server  $host;
      proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    
      location / {
        proxy_pass  http://172.31.20.70;
      }
    }

    # ILO Console
    server{
      listen 80;
      server_name ilo.newvia.net;

      proxy_ssl_verify off;

      proxy_http_version 1.1;
      proxy_set_header  Host $host;
      proxy_set_header Upgrade $http_upgrade; 
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Host  $host;
      proxy_set_header  X-Forwarded-Server  $host;
      proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    
      location / {
        proxy_pass  https://172.31.10.214/;
      }
    }
