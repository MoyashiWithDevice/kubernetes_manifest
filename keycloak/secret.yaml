apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  namespace: keycloak
  name: vault-connection
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: true

---  

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: keycloak
  name: keycloak-secret
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: keycloak
  refreshAfter: 60s
  destination:
    create: true
    name: secret

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  namespace:  keycloak
  name: vault-auth
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: keycloak
    serviceAccount: keycloak-sa
  allowedNamespaces:
    - keycloak
