apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-backend-role
  namespace: terraform
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-backend-rolebinding
  namespace: terraform
subjects:
- kind: ServiceAccount
  name: default
  namespace: terraform
roleRef:
  kind: Role
  name: terraform-backend-role
  apiGroup: rbac.authorization.k8s.io