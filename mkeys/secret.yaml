apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  namespace: mkeys
  name: vault-connection
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: true

---  

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: mkeys
  name: mkeys-url-secret
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: mkeys
  refreshAfter: 60s
  destination:
    create: true
    name: git-url

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  namespace:  mkeys
  name: vault-auth
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mkeys
    serviceAccount: mkeys-sa
  allowedNamespaces:
    - mkeys
