apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  namespace: ansible
  name: vault-connection
spec:
  address: https://vault.vault.svc.cluster.local:8200
  skipTLSVerify: true

---  

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ansible
  name: ansible-url-secret
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: ansible
  refreshAfter: 60s
  destination:
    create: true
    name: git-url

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  namespace:  ansible
  name: vault-auth
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: ansible
    serviceAccount: ansible-sa
  allowedNamespaces:
    - ansible
