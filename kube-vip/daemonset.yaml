apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-vip
spec:
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
    spec:
      serviceAccountName: kube-vip-sa
      hostNetwork: true
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.0.1
          args: ["manager"]
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"          # control-plane VIPは使わないので実質未使用
            - name: cp_enable
              value: "false"         # 今回はコントロールプレーンHAは対象外
            - name: svc_enable
              value: "true"          # Service(LoadBalancer)の処理を有効化
            - name: svc_election
              value: "true"          # per-serviceリーダー選出 → Podに追従させる肝
            - name: vip_leaderelection
              value: "true"
            - name: egress_withnftables
              value: "true"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_TIME
      tolerations:
        - operator: Exists
